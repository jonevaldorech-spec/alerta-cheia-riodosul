name: Coleta e alerta de cheia (Rio do Sul)

# Roda na nuvem do GitHub — PC pode estar desligado.
on:
  schedule:
    # minutos 13 e 43 (evita :00/:30, os mais congestionados — a doc do GitHub
    # recomenda fugir do topo da hora para reduzir atraso/descarte do agendador).
    - cron: "13,43 * * * *"   # a cada 30 min (UTC). Para 15 min: "13,28,43,58 * * * *"
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
    inputs:
      teste_email:
        description: "Enviar um e-mail de TESTE (mesmo sem evento)?"
        type: boolean
        default: false

# evita duas rodadas empurrando commit ao mesmo tempo
concurrency:
  group: coleta-cheia
  cancel-in-progress: false

permissions:
  contents: write   # commitar os dados coletados
  issues: write     # abrir issue de alerta (e-mail via GitHub) se não houver SMTP

jobs:
  coleta:
    runs-on: ubuntu-latest
    # HAS_MAIL = 'true' só se os secrets de e-mail existirem
    env:
      HAS_MAIL: ${{ secrets.MAIL_PASSWORD != '' && secrets.MAIL_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Coletar (2 fontes) e avaliar evento
        id: coleta
        run: python coletor.py

      - name: Guardar dados no repositório
        run: |
          git config user.name  "coletor-bot"
          git config user.email "actions@github.com"
          git add dados estado_atual.md evento.txt assunto.txt
          if git diff --cached --quiet; then
            echo "sem mudanças"
          else
            git commit -m "coleta ${{ github.run_number }} — evento=${{ steps.coleta.outputs.evento }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      # --- ALERTA POR E-MAIL (só em evento) ---------------------------------
      # Opção A: e-mail direto via Gmail (se você cadastrar os secrets — ver README)
      - name: E-mail de alerta (Gmail SMTP)
        if: ${{ (steps.coleta.outputs.evento == 'SIM' || github.event.inputs.teste_email == 'true') && env.HAS_MAIL == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ github.event.inputs.teste_email == 'true' && '[TESTE] Alerta Cheia Rio do Sul — envio de teste OK' || steps.coleta.outputs.assunto }}
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          from: Alerta Cheia Rio do Sul <${{ secrets.MAIL_USERNAME }}>
          html_body: file://estado_atual.md
          convert_markdown: true

      # Opção B: sem SMTP configurado -> abre/atualiza issue (GitHub te manda e-mail)
      - name: Alerta via Issue (fallback sem SMTP)
        if: steps.coleta.outputs.evento == 'SIM' && env.HAS_MAIL != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const corpo = fs.readFileSync('estado_atual.md', 'utf8');
            const assunto = fs.readFileSync('assunto.txt', 'utf8').trim();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: assunto,
              body: corpo,
              labels: ['alerta-cheia']
            });
